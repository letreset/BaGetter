apiVersion: v2
name: bagetter
description: A Helm chart for BaGetter nuget package server
type: application

# Chart and app versions move together. The release workflow overrides both with the git tag
# (helm package --version/--app-version), so these values only matter for local installs.
version: 2.0.0
appVersion: "2.0.0"

keywords:
  - nuget
  - baget
  - bagetter

home: https://letreset.github.io/BaGetter/

sources:
  - https://github.com/letreset/BaGetter
  - https://hub.docker.com/r/letreset/bagetter

dependencies:
  - name: common
    repository: https://bjw-s-labs.github.io/helm-charts
    version: 3.0.3
